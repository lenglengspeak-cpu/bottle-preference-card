<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6d1634">
  <meta name="description" content="点击小瓶子，轻松整理并分享彼此的偏好与边界。">
  <title>小瓶子偏好卡</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d1634'/%3E%3Cpath d='M25 8h14v8l6 7v25a8 8 0 0 1-8 8H27a8 8 0 0 1-8-8V23l6-7z' fill='%23f4dce4' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M22 37h20v11a5 5 0 0 1-5 5H27a5 5 0 0 1-5-5z' fill='%23e5325d'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #2d1720;
      --muted: #775f69;
      --wine: #6d1634;
      --red: #d92850;
      --rose: #f8e6ec;
      --paper: #fffafa;
      --line: #ead9df;
      --shadow: 0 10px 30px rgba(91, 27, 51, .09);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% -5%, rgba(235, 75, 112, .12), transparent 28rem),
        linear-gradient(180deg, #fffafb 0%, #fff 26rem);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 24px 16px calc(118px + env(safe-area-inset-bottom));
    }

    header {
      position: relative;
      overflow: hidden;
      padding: 24px 22px 20px;
      border: 1px solid rgba(109, 22, 52, .1);
      border-radius: 24px;
      background: rgba(255, 255, 255, .88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    header::after {
      content: "";
      position: absolute;
      right: -34px;
      top: -42px;
      width: 138px;
      height: 138px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(217, 40, 80, .18), rgba(109, 22, 52, .04));
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--red);
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .12em;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: ui-serif, "Songti SC", "STSong", serif;
      font-size: clamp(1.85rem, 7vw, 2.7rem);
      line-height: 1.12;
      letter-spacing: -.03em;
    }

    .intro {
      max-width: 560px;
      margin: 10px 0 0;
      color: var(--muted);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #604450;
      font-size: .82rem;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #d9dfe8;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    }

    .dot.one-third { background: #f3acbc; }
    .dot.two-thirds { background: #dc5a79; }
    .dot.full { background: #a90f35; }

    .progress-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      align-items: center;
      margin: 18px 0 8px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.82);
    }

    .progress-copy { color: var(--muted); font-size: .9rem; }
    .progress-copy strong { color: var(--ink); }
    .progress-count { color: var(--wine); font-weight: 800; font-variant-numeric: tabular-nums; }

    .progress-track {
      grid-column: 1 / -1;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #f0e7ea;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #eb6583, #aa1037);
      transition: width .28s ease;
    }

    .shared-banner {
      display: none;
      margin: 12px 0 0;
      padding: 11px 14px;
      border-radius: 14px;
      background: #f6edf0;
      color: #684654;
      font-size: .9rem;
    }

    .shared-banner.visible { display: block; }

    main { margin-top: 14px; }

    section {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 8px 26px rgba(91, 27, 51, .05);
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      color: var(--wine);
      font-family: ui-serif, "Songti SC", "STSong", serif;
      font-size: 1.25rem;
      letter-spacing: .02em;
    }

    .section-meta { color: #9a808a; font-size: .78rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .choice {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 6px;
      align-items: center;
      min-width: 0;
      min-height: 112px;
      padding: 8px 4px 7px;
      border: 1px solid #eee2e6;
      border-radius: 15px;
      background: #fff;
      color: var(--ink);
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }

    .choice:active { transform: scale(.975); }
    .choice:focus-visible { outline: 3px solid rgba(217, 40, 80, .25); outline-offset: 2px; }
    .choice[data-state="1"] { border-color: #e9b4c1; background: #fff8fa; }
    .choice[data-state="2"] { border-color: #dc879b; background: #fff5f8; }
    .choice[data-state="3"] { border-color: #c94766; background: #fff2f6; box-shadow: inset 0 0 0 1px rgba(177, 19, 57, .08); }

    .choice[data-state="0"] .bottle { background-position: -432px -668px; }
    .choice[data-state="1"] .bottle { background-position: -328px -51px; }
    .choice[data-state="2"] .bottle { background-position: -432px -51px; }
    .choice[data-state="3"] .bottle { background-position: -122px -51px; }

    .choice-label {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
      width: 100%;
      font-size: .8rem;
      font-weight: 650;
      line-height: 1.28;
      overflow-wrap: anywhere;
    }

    .safety {
      margin: 20px 4px 0;
      color: #7a626c;
      font-size: .85rem;
      text-align: center;
    }

    .action-bar {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 0;
      display: grid;
      grid-template-columns: .78fr 1.16fr 1.28fr;
      gap: 8px;
      width: min(100%, 960px);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      border-top: 1px solid rgba(109, 22, 52, .12);
      background: rgba(255, 250, 251, .92);
      box-shadow: 0 -10px 30px rgba(75, 22, 42, .09);
      backdrop-filter: blur(18px);
    }

    .action {
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 750;
    }

    .reset { background: #f1e7ea; color: #684654; }
    .generate { background: #f7dce5; color: #7d1739; box-shadow: inset 0 0 0 1px rgba(125, 23, 57, .08); }
    .share { background: linear-gradient(135deg, #7d1739, #b4133d); color: #fff; box-shadow: 0 8px 20px rgba(133, 21, 58, .25); }

    .toast {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: calc(86px + env(safe-area-inset-bottom));
      max-width: calc(100% - 32px);
      padding: 11px 16px;
      transform: translate(-50%, 16px);
      border-radius: 999px;
      background: #321c25;
      color: #fff;
      font-size: .88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    dialog {
      width: min(calc(100% - 32px), 480px);
      border: 0;
      border-radius: 20px;
      padding: 22px;
      color: var(--ink);
      box-shadow: 0 24px 80px rgba(50, 19, 30, .28);
    }

    dialog::backdrop { background: rgba(43, 20, 29, .42); backdrop-filter: blur(4px); }
    dialog h3 { margin: 0 0 8px; font-size: 1.2rem; }
    dialog p { margin: 0 0 16px; color: var(--muted); font-size: .92rem; }
    dialog input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .dialog-actions button { border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; }
    .dialog-actions .copy { background: var(--wine); color: #fff; }

    .image-dialog { width: min(calc(100% - 24px), 620px); max-height: 90vh; overflow: auto; }
    .generated-frame {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f5ecef;
    }
    .generated-frame img { display: block; width: 100%; height: auto; }

    @media (max-width: 390px) {
      .action-bar { padding-inline: 10px; gap: 6px; }
      .action { font-size: .86rem; }
    }

    @media (min-width: 620px) {
      .app { padding-inline: 24px; }
      .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      section { padding: 22px; }
    }

    @media (min-width: 840px) {
      .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <p class="eyebrow">CLICK · FILL · SHARE</p>
      <h1>小瓶子偏好卡</h1>
      <p class="intro">轻点瓶子依次增加液体，整理彼此想聊、想尝试与暂不考虑的内容。</p>
      <div class="legend" aria-label="状态说明">
        <span><i class="dot"></i>空瓶</span>
        <span><i class="dot one-third"></i>三分之一瓶</span>
        <span><i class="dot two-thirds"></i>三分之二瓶</span>
        <span><i class="dot full"></i>满瓶</span>
      </div>
    </header>

    <div class="progress-card" aria-live="polite">
      <div class="progress-copy"><strong>当前进度</strong> · 已标记的项目</div>
      <div class="progress-count"><span id="markedCount">0</span>/<span id="totalCount">0</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div id="sharedBanner" class="shared-banner">你打开的是一份好友分享的偏好卡，可以在这份基础上继续修改，再分享给对方。</div>

    <main id="sections"></main>

    <p class="safety">仅用于成年人之间自愿、安全、清醒的沟通。页面标记不等于同意；每次实践前仍需再次确认边界、安全词与停止方式。</p>
  </div>

  <div class="action-bar">
    <button class="action reset" id="resetButton" type="button">清空</button>
    <button class="action generate" id="generateButton" type="button">生成图片</button>
    <button class="action share" id="shareButton" type="button">分享链接</button>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <dialog id="shareDialog">
    <h3>复制这条分享链接</h3>
    <p>链接已经包含你当前涂好的结果。在微信中粘贴发送给好友即可。</p>
    <input id="shareUrl" readonly aria-label="分享链接">
    <div class="dialog-actions">
      <button type="button" id="closeDialog">关闭</button>
      <button type="button" class="copy" id="copyDialog">复制链接</button>
    </div>
  </dialog>

  <dialog id="imageDialog" class="image-dialog">
    <h3>已生成填涂图片</h3>
    <p>手机可以长按下面的图片保存；电脑可以点击“下载图片”。图片只在你的设备上生成，不会上传。</p>
    <div class="generated-frame"><img id="generatedImage" alt="已填涂的小瓶子偏好卡"></div>
    <div class="dialog-actions">
      <button type="button" id="closeImageDialog">关闭</button>
      <button type="button" class="copy" id="downloadImage">下载图片</button>
    </div>
  </dialog>

  <script>
    const groups = [
      { name: "类型氛围", items: ["纯实践", "惩戒管教", "角色扮演", "欢快/温馨氛围", "严肃氛围"] },
      { name: "击打部位", items: ["屁股", "大腿后侧", "大腿正侧", "手心", "脚心", "后背", "脸", "胸", "私处", "臀缝"] },
      { name: "实践感受", items: ["仪式感", "羞耻感", "压迫感", "被控制感", "服从感"] },
      { name: "束缚相关", items: ["地面绳缚", "吊缚", "项圈", "口球/胶带封嘴", "眼罩"] },
      { name: "感官刺激", items: ["强高（不入体）", "强高（入体）", "电击拍", "电击乳夹（巨疼）", "挠痒痒"] },
      { name: "其他项目", items: ["普通乳夹", "k9爬行", "走绳", "木马虐阴", "姜罚", "难受姿势"] },
      { name: "羞耻玩法", items: ["对镜玩", "dirty talk", "身体检查", "剃毛", "强制自慰", "憋尿放尿", "撕丝袜", "丝袜堵嘴", "内裤堵嘴", "车内play", "户外play"] },
      { name: "实践穿着", items: ["jk制服/水手服", "情趣内衣", "丝袜", "丁字裤", "小腿袜"] },
      { name: "实践称呼", items: ["哥哥/妹妹", "主人/小狗"] },
      { name: "拍摄相关", items: ["实践录音", "拍照", "录视频"] }
    ];

    const flatItems = groups.flatMap(group => group.items);
    const legacyV2Items = groups.flatMap(group => {
      if (group.name === "其他项目") return ["普通乳夹", "k9爬行", "走绳/木马虐阴", "姜罚", "难受姿势"];
      if (group.name === "羞耻玩法") return ["对镜玩", "dirty talk", "身体检查", "剃毛", "强制自慰", "憋尿放尿", "撕丝袜", "丝袜堵嘴", "内裤堵嘴", "车内/户外play"];
      if (group.name === "拍摄相关") return ["实践录音", "拍照（不露脸）", "拍照（露脸）", "录视频（不露脸）", "录视频（露脸）"];
      return group.items;
    });
    const labels = ["空瓶", "三分之一瓶", "三分之二瓶", "满瓶"];
    const storageKey = "bottle-preference-card-v3";
    const v2StorageKey = "bottle-preference-card-v2";
    const legacyStorageKey = "bottle-preference-card-v1";
    const sections = document.getElementById("sections");
    const markedCount = document.getElementById("markedCount");
    const totalCount = document.getElementById("totalCount");
    const progressFill = document.getElementById("progressFill");
    const toast = document.getElementById("toast");
    const shareDialog = document.getElementById("shareDialog");
    const shareUrl = document.getElementById("shareUrl");
    const imageDialog = document.getElementById("imageDialog");
    const generatedImage = document.getElementById("generatedImage");
    const generateButton = document.getElementById("generateButton");
    let toastTimer;
    let bottleSheetPromise;
    let generatedImageUrl;

    function emptyState() {
      return Array(flatItems.length).fill(0);
    }

    function encodeState(values) {
      const raw = values.join("");
      return btoa(raw).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
    }

    function decodeState(value) {
      try {
        const padded = value.replaceAll("-", "+").replaceAll("_", "/") + "===".slice((value.length + 3) % 4);
        const raw = atob(padded);
        if (raw.length !== flatItems.length || !/^[0123]+$/.test(raw)) return null;
        return [...raw].map(Number);
      } catch { return null; }
    }

    function migrateLegacy(values) {
      return values.map(value => value === 2 ? 3 : value === 1 ? 2 : 0);
    }

    function migrateV2(values) {
      const previous = Object.fromEntries(legacyV2Items.map((name, index) => [name, values[index] ?? 0]));
      return flatItems.map(name => {
        if (name === "走绳" || name === "木马虐阴") return previous["走绳/木马虐阴"] ?? 0;
        if (name === "车内play" || name === "户外play") return previous["车内/户外play"] ?? 0;
        if (name === "拍照") return Math.max(previous["拍照（不露脸）"] ?? 0, previous["拍照（露脸）"] ?? 0);
        if (name === "录视频") return Math.max(previous["录视频（不露脸）"] ?? 0, previous["录视频（露脸）"] ?? 0);
        return previous[name] ?? 0;
      });
    }

    const params = new URLSearchParams(location.search);
    const decodedSharedState = params.get("s") ? decodeState(params.get("s")) : null;
    const sharedState = !decodedSharedState ? null
      : params.get("v") === "3" ? decodedSharedState
      : params.get("v") === "2" ? migrateV2(decodedSharedState)
      : migrateV2(migrateLegacy(decodedSharedState));
    let state = sharedState;

    if (!state) {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (Array.isArray(saved) && saved.length === flatItems.length) {
          state = saved.map(v => [0,1,2,3].includes(v) ? v : 0);
        } else {
          const savedV2 = JSON.parse(localStorage.getItem(v2StorageKey));
          if (Array.isArray(savedV2) && savedV2.length === legacyV2Items.length) {
            state = migrateV2(savedV2.map(v => [0,1,2,3].includes(v) ? v : 0));
          } else {
            const legacy = JSON.parse(localStorage.getItem(legacyStorageKey));
            state = Array.isArray(legacy) && legacy.length === legacyV2Items.length
              ? migrateV2(migrateLegacy(legacy))
              : emptyState();
          }
        }
      } catch { state = emptyState(); }
    } else {
      document.getElementById("sharedBanner").classList.add("visible");
    }

    function render() {
      let itemIndex = 0;
      sections.innerHTML = groups.map((group, groupIndex) => {
        const buttons = group.items.map(item => {
          const index = itemIndex++;
          const value = state[index];
          return `<button class="choice" type="button" data-index="${index}" data-state="${value}" aria-label="${item}：${labels[value]}">
            <span class="bottle" aria-hidden="true"></span>
            <span class="choice-label">${item}</span>
          </button>`;
        }).join("");
        return `<section aria-labelledby="group-${groupIndex}">
          <div class="section-head"><h2 id="group-${groupIndex}">${group.name}</h2><span class="section-meta">${group.items.length} 项</span></div>
          <div class="grid">${buttons}</div>
        </section>`;
      }).join("");

      sections.querySelectorAll(".choice").forEach(button => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.index);
          state[index] = (state[index] + 1) % 4;
          button.dataset.state = state[index];
          button.setAttribute("aria-label", `${flatItems[index]}：${labels[state[index]]}`);
          persist();
          updateProgress();
        });
      });
      totalCount.textContent = flatItems.length;
      updateProgress();
    }

    function persist() {
      localStorage.setItem(storageKey, JSON.stringify(state));
      const url = new URL(location.href);
      url.searchParams.set("s", encodeState(state));
      url.searchParams.set("v", "3");
      history.replaceState(null, "", url);
    }

    function updateProgress() {
      const marked = state.filter(Boolean).length;
      markedCount.textContent = marked;
      progressFill.style.width = `${marked / state.length * 100}%`;
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function roundedRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + width, y, x + width, y + height, r);
      context.arcTo(x + width, y + height, x, y + height, r);
      context.arcTo(x, y + height, x, y, r);
      context.arcTo(x, y, x + width, y, r);
      context.closePath();
    }

    function wrapCanvasText(context, text, maxWidth, maxLines = 2) {
      const lines = [];
      let current = "";
      for (const character of [...text]) {
        const candidate = current + character;
        if (current && context.measureText(candidate).width > maxWidth) {
          lines.push(current);
          current = character;
          if (lines.length === maxLines - 1) break;
        } else {
          current = candidate;
        }
      }
      const consumed = lines.join("").length;
      if (lines.length < maxLines && consumed < text.length) {
        let finalLine = text.slice(consumed);
        while (context.measureText(finalLine).width > maxWidth && finalLine.length > 1) {
          finalLine = finalLine.slice(0, -1);
        }
        if (consumed + finalLine.length < text.length) finalLine = finalLine.slice(0, -1) + "…";
        lines.push(finalLine);
      } else if (current && lines.length < maxLines) {
        lines.push(current);
      }
      return lines;
    }

    function getBottleSheet() {
      if (bottleSheetPromise) return bottleSheetPromise;
      bottleSheetPromise = new Promise((resolve, reject) => {
        const sample = document.querySelector(".bottle");
        const background = sample ? getComputedStyle(sample).backgroundImage : "";
        const match = background.match(/^url\(["']?(.*?)["']?\)$/);
        if (!match) {
          reject(new Error("无法读取瓶子图片"));
          return;
        }
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("瓶子图片加载失败"));
        image.src = match[1];
      });
      return bottleSheetPromise;
    }

    async function createCardImage() {
      const sheet = await getBottleSheet();
      const canvasWidth = 1200;
      const margin = 60;
      const contentWidth = canvasWidth - margin * 2;
      const columns = 6;
      const columnGap = 14;
      const cardWidth = (contentWidth - columnGap * (columns - 1)) / columns;
      const cardHeight = 174;
      const rowGap = 12;
      const groupHeaderHeight = 58;
      const groupGap = 24;
      const headerHeight = 220;
      const footerHeight = 110;
      const groupsHeight = groups.reduce((height, group) => {
        const rows = Math.ceil(group.items.length / columns);
        return height + groupHeaderHeight + rows * cardHeight + Math.max(0, rows - 1) * rowGap + groupGap;
      }, 0);
      const canvasHeight = margin + headerHeight + groupsHeight + footerHeight;
      const canvas = document.createElement("canvas");
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      const context = canvas.getContext("2d");
      if (!context) throw new Error("当前浏览器无法生成图片");

      context.fillStyle = "#fffafa";
      context.fillRect(0, 0, canvasWidth, canvasHeight);
      const glow = context.createRadialGradient(130, 20, 10, 130, 20, 420);
      glow.addColorStop(0, "rgba(235,75,112,.15)");
      glow.addColorStop(1, "rgba(235,75,112,0)");
      context.fillStyle = glow;
      context.fillRect(0, 0, 600, 500);

      context.fillStyle = "#6d1634";
      context.font = '700 52px "Songti SC", "STSong", serif';
      context.fillText("小瓶子偏好卡", margin, margin + 58);
      context.fillStyle = "#775f69";
      context.font = '24px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      context.fillText("轻点瓶子，整理彼此想聊、想尝试与暂不考虑的内容", margin, margin + 102);

      const marked = state.filter(Boolean).length;
      context.textAlign = "right";
      context.fillStyle = "#6d1634";
      context.font = '700 27px -apple-system, "PingFang SC", sans-serif';
      context.fillText(`已标记 ${marked}/${state.length}`, canvasWidth - margin, margin + 58);
      context.textAlign = "left";

      const legend = [
        { label: "空瓶", color: "#d9dfe8" },
        { label: "三分之一瓶", color: "#f3acbc" },
        { label: "三分之二瓶", color: "#dc5a79" },
        { label: "满瓶", color: "#a90f35" }
      ];
      context.font = '21px -apple-system, "PingFang SC", sans-serif';
      let legendX = margin;
      legend.forEach(item => {
        context.fillStyle = item.color;
        context.beginPath();
        context.arc(legendX + 9, margin + 151, 9, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "#604450";
        context.fillText(item.label, legendX + 27, margin + 159);
        legendX += context.measureText(item.label).width + 74;
      });

      const stateColors = [
        { fill: "#ffffff", stroke: "#eadfe3" },
        { fill: "#fff8fa", stroke: "#e9b4c1" },
        { fill: "#fff5f8", stroke: "#dc879b" },
        { fill: "#fff2f6", stroke: "#c94766" }
      ];
      const spritePositions = [
        { x: 432, y: 668 },
        { x: 328, y: 51 },
        { x: 432, y: 51 },
        { x: 122, y: 51 }
      ];
      const spriteScale = sheet.naturalWidth / 640;
      const bottleWidth = 72;
      const bottleHeight = 105;
      let y = margin + headerHeight;
      let itemIndex = 0;

      groups.forEach(group => {
        context.fillStyle = "#6d1634";
        context.font = '700 30px "Songti SC", "STSong", serif';
        context.fillText(group.name, margin, y + 35);
        context.textAlign = "right";
        context.fillStyle = "#9a808a";
        context.font = '21px -apple-system, "PingFang SC", sans-serif';
        context.fillText(`${group.items.length} 项`, canvasWidth - margin, y + 34);
        context.textAlign = "left";
        y += groupHeaderHeight;

        group.items.forEach((item, indexInGroup) => {
          const row = Math.floor(indexInGroup / columns);
          const column = indexInGroup % columns;
          const x = margin + column * (cardWidth + columnGap);
          const cardY = y + row * (cardHeight + rowGap);
          const value = state[itemIndex++] ?? 0;
          const colors = stateColors[value];
          roundedRect(context, x, cardY, cardWidth, cardHeight, 17);
          context.fillStyle = colors.fill;
          context.fill();
          context.lineWidth = 2;
          context.strokeStyle = colors.stroke;
          context.stroke();

          const position = spritePositions[value];
          const bottleX = x + (cardWidth - bottleWidth) / 2;
          const bottleY = cardY + 10;
          context.imageSmoothingEnabled = false;
          context.drawImage(
            sheet,
            position.x * spriteScale,
            position.y * spriteScale,
            48 * spriteScale,
            70 * spriteScale,
            bottleX,
            bottleY,
            bottleWidth,
            bottleHeight
          );

          context.imageSmoothingEnabled = true;
          context.fillStyle = "#2d1720";
          context.font = '600 20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
          context.textAlign = "center";
          const lines = wrapCanvasText(context, item, cardWidth - 14, 2);
          lines.forEach((line, lineIndex) => {
            context.fillText(line, x + cardWidth / 2, cardY + 139 + lineIndex * 23);
          });
          context.textAlign = "left";
        });

        const rows = Math.ceil(group.items.length / columns);
        y += rows * cardHeight + Math.max(0, rows - 1) * rowGap + groupGap;
      });

      context.textAlign = "center";
      context.fillStyle = "#7a626c";
      context.font = '20px -apple-system, "PingFang SC", sans-serif';
      context.fillText("仅用于成年人之间自愿、安全、清醒的沟通；填涂结果不等于同意。", canvasWidth / 2, canvasHeight - 58);
      context.fillStyle = "#ad8795";
      context.font = '18px -apple-system, "PingFang SC", sans-serif';
      context.fillText("小瓶子偏好卡", canvasWidth / 2, canvasHeight - 27);

      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("图片生成失败")), "image/png");
      });
    }

    async function generateCurrentImage() {
      const originalText = generateButton.textContent;
      generateButton.disabled = true;
      generateButton.textContent = "生成中…";
      try {
        const blob = await createCardImage();
        if (generatedImageUrl) URL.revokeObjectURL(generatedImageUrl);
        generatedImageUrl = URL.createObjectURL(blob);
        generatedImage.src = generatedImageUrl;
        imageDialog.showModal();
      } catch (error) {
        showToast(error?.message || "图片生成失败，请稍后重试");
      } finally {
        generateButton.disabled = false;
        generateButton.textContent = originalText;
      }
    }

    function registerWebMCP() {
      const context = document.modelContext;
      if (!context?.registerTool) return;

      const register = tool => {
        try { Promise.resolve(context.registerTool(tool)).catch(() => {}); } catch {}
      };

      register({
        name: "read_preference_card",
        title: "读取小瓶子偏好卡",
        description: "读取当前页面上所有项目及其瓶子状态。0 表示空瓶，1 表示三分之一瓶，2 表示三分之二瓶，3 表示满瓶。",
        inputSchema: { type: "object", properties: {}, additionalProperties: false },
        annotations: { readOnlyHint: true, untrustedContentHint: false },
        execute() {
          return { items: flatItems.map((name, index) => ({ name, level: state[index], label: labels[state[index]] })) };
        }
      });

      register({
        name: "set_preference_items",
        title: "设置小瓶子状态",
        description: "按项目名称批量设置瓶子状态，并同步更新页面、自动保存和分享链接。level 只能是 0、1、2 或 3。",
        inputSchema: {
          type: "object",
          properties: {
            items: {
              type: "array",
              minItems: 1,
              items: {
                type: "object",
                properties: { name: { type: "string" }, level: { type: "integer", minimum: 0, maximum: 3 } },
                required: ["name", "level"],
                additionalProperties: false
              }
            }
          },
          required: ["items"],
          additionalProperties: false
        },
        annotations: { readOnlyHint: false, untrustedContentHint: false },
        execute(input) {
          if (!input || !Array.isArray(input.items) || input.items.length === 0) throw new Error("items 必须是非空数组");
          const updates = input.items.map(item => {
            const index = flatItems.indexOf(item?.name);
            if (index < 0) throw new Error(`找不到项目：${item?.name ?? ""}`);
            if (![0, 1, 2, 3].includes(item.level)) throw new Error(`状态无效：${item.name}`);
            return { index, name: item.name, level: item.level };
          });
          updates.forEach(update => { state[update.index] = update.level; });
          persist();
          render();
          return { updated: updates.map(({ name, level }) => ({ name, level, label: labels[level] })) };
        }
      });
    }

    async function copyLink(url) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(url);
        return true;
      }
      shareUrl.value = url;
      shareUrl.focus();
      shareUrl.select();
      return document.execCommand("copy");
    }

    generateButton.addEventListener("click", generateCurrentImage);
    document.getElementById("closeImageDialog").addEventListener("click", () => imageDialog.close());
    document.getElementById("downloadImage").addEventListener("click", () => {
      if (!generatedImageUrl) return;
      const link = document.createElement("a");
      link.href = generatedImageUrl;
      link.download = "小瓶子偏好卡.png";
      document.body.appendChild(link);
      link.click();
      link.remove();
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      if (!confirm("确定清空全部瓶子吗？")) return;
      state = emptyState();
      localStorage.removeItem(storageKey);
      localStorage.removeItem(v2StorageKey);
      localStorage.removeItem(legacyStorageKey);
      const url = new URL(location.href);
      url.searchParams.delete("s");
      url.searchParams.delete("v");
      history.replaceState(null, "", url);
      render();
      showToast("已经清空");
    });

    document.getElementById("shareButton").addEventListener("click", async () => {
      persist();
      const url = location.href;
      const title = "我的小瓶子偏好卡";
      const text = "我涂好了一份小瓶子偏好卡，打开看看，也可以继续涂。";
      if (navigator.share) {
        try {
          await navigator.share({ title, text, url });
          return;
        } catch (error) {
          if (error && error.name === "AbortError") return;
        }
      }
      try {
        await copyLink(url);
        showToast("链接已复制，粘贴到微信发给好友即可");
      } catch {
        shareUrl.value = url;
        shareDialog.showModal();
        shareUrl.select();
      }
    });

    document.getElementById("closeDialog").addEventListener("click", () => shareDialog.close());
    document.getElementById("copyDialog").addEventListener("click", async () => {
      try {
        await copyLink(shareUrl.value);
        shareDialog.close();
        showToast("链接已复制");
      } catch { shareUrl.select(); }
    });

    render();
    registerWebMCP();
  </script>
</body>
</html>
